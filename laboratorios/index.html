<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorios de informática</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap">
<style>
:root{--bg:#F4F6F8;--surface:#fff;--ink:#0E1B32;--muted:#55697C;--line:#C9D5DF;--accent:#00B8CF;--accent-ink:#17627C;--chip:#DFF5F9;--warn-bg:#FCE6CC;
  --f-head:'Poppins',system-ui,sans-serif;--f-body:'Open Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1628;--surface:#12223A;--ink:#E6EEF6;--muted:#93A7BC;--line:#2A4362;--accent:#2BD3EA;--accent-ink:#6FE3F2;--chip:#143553;--warn-bg:#4A3218;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
header{border-top:6px solid var(--accent);padding-top:18px;margin-bottom:18px}
.eyebrow{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
h1{font:700 clamp(28px,4.5vw,42px)/1.1 var(--f-head);margin:6px 0 8px}
.lead{color:var(--muted);margin:0;max-width:70ch}
nav.grupos{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
nav.grupos a{font:600 16px var(--f-head);padding:10px 18px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
nav.grupos a:hover,nav.grupos a:focus-visible{border-color:var(--accent)}
.buscar{margin:6px 0 20px}
.buscar input{width:100%;max-width:420px;font:400 17px var(--f-body);padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.buscar input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section.grupo{margin:26px 0 0}
section.grupo>h2{font:700 clamp(22px,3vw,28px) var(--f-head);margin:0 0 12px;scroll-margin-top:12px}
.modulo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;margin-bottom:14px}
.modulo h3{font:600 19px var(--f-head);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
a.card,div.card{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;min-height:96px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);background:var(--chip);outline:none}
div.card{opacity:.6}
.tipo{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nuevo{background:var(--warn-bg);color:var(--ink);padding:1px 8px;border-radius:999px;letter-spacing:.02em}
.titulo{font:600 17px/1.3 var(--f-head)}
.sub{font-size:14px;color:var(--muted)}
.vacio{color:var(--muted);font-size:15px;margin:8px 0 0}
footer{margin-top:34px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Ébora Formación · Curso 2026-2027</div>
  <h1>Laboratorios de informática</h1>
  <p class="lead">Guarda esta página en marcadores: aquí estarán siempre todos los laboratorios y talleres de tus módulos. Elige tu grupo y pulsa en el tema.</p>
</header>
<nav class="grupos" id="nav" aria-label="Grupos"></nav>
<div class="buscar"><label for="q" class="sub">Buscar</label><br><input id="q" type="search" placeholder="Por ejemplo: trama, procesos, HTML…" autocomplete="off"></div>
<main id="main"></main>
<footer>Si un enlace no funciona, avisa al profesor.</footer>
</div>

<script>
/* =====================================================================
   PARA AÑADIR UN LABORATORIO O UN TALLER: copia una línea { ... } del
   módulo, cambia título, descripción y url, y sube el fichero al repo.
   - url relativa (smr/redes/tema3.html) para ficheros de este repo,
     o completa (https://...) para webs externas como la de Montaje.
   - url vacía ('') → se muestra como «Próximamente», sin enlace.
   - nuevo: true → etiqueta «Nuevo».
   ===================================================================== */
const SITIO = [
  { id: 'smr', grupo: '1.º SMR · Sistemas Microinformáticos y Redes', modulos: [
    { nombre: 'Montaje y mantenimiento de equipos', items: [
      { tipo: 'Laboratorio', titulo: 'Tema 1 · Arquitectura y componentes', sub: 'Bloques, buses, CPU, placa, memoria y conectores', url: 'smr/montaje/tema1.html' },
      { tipo: 'Laboratorio', titulo: 'Tema 2 · Selección de componentes', sub: 'Chasis, almacenamiento, adaptadores, OEM y retail', url: 'smr/montaje/tema2.html' },
      { tipo: 'Taller', titulo: 'Taller de Montaje', sub: 'Componentes en 3D, cómo encajan y montaje seguro de un PC', url: 'https://luisbs-ebora.github.io/taller-montaje/' }
    ]},
    { nombre: 'Redes locales', items: [
      { tipo: 'Laboratorio', titulo: 'Tema 1 · Introducción a las redes locales', sub: 'Tipos, elementos, topologías y mapas de red', url: 'smr/redes/tema1.html' },
      { tipo: 'Laboratorio', titulo: 'Tema 2 · Medios de transmisión y espacios físicos', sub: 'Rack, cables, fibra, Wi‑Fi, conectores y tester', url: 'smr/redes/tema2.html', nuevo: true },
      { tipo: 'Taller', titulo: 'Taller de Redes', sub: 'Web de práctica del módulo', url: 'https://luisbs-ebora.github.io/taller-redes/' }
    ]},
    { nombre: 'Sistemas operativos monopuesto', items: [
      { tipo: 'Laboratorio', titulo: 'Tema 1 · El sistema informático y los SO', sub: 'Hardware, software, sistemas de numeración y licencias', url: 'smr/so/tema1.html' },
      { tipo: 'Laboratorio', titulo: 'Tema 2 · Procesos y gestión de recursos', sub: 'Estados, planificación (Gantt) y memoria', url: 'smr/so/tema2.html', nuevo: true }
    ]},
    { nombre: 'Aplicaciones web', items: [
      { tipo: 'Laboratorio', titulo: 'Tema 1 · Internet, servicios web y tendencias', sub: 'Cliente-servidor, HTTP, DNS y bases de datos', url: 'smr/web/tema1.html' },
      { tipo: 'Laboratorio', titulo: 'Tema 2 · Páginas web con HTML y XHTML', sub: 'Editor con retos: etiquetas, formularios y validación', url: 'smr/web/tema2.html', nuevo: true }
    ]}
  ]},
  { id: 'asir', grupo: '1.º ASIR · Administración de Sistemas Informáticos en Red', modulos: [
    { nombre: 'Planificación y administración de redes', items: [
      { tipo: 'Laboratorio', titulo: 'Tema 1 · Caracterización de redes', sub: 'Binario, OSI y TCP/IP, Wireshark simulado, ARP, CSMA/CD y trama Ethernet', url: 'asir/par/tema1.html' }
    ]}
  ]}
];

const $ = s => document.querySelector(s);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const n in a) { if (n === 'class') e.className = a[n]; else e.setAttribute(n, a[n]); } k.forEach(x => e.append(x)); return e; };
function render(q = '') {
  const qq = q.trim().toLowerCase(), main = $('#main'); main.innerHTML = '';
  SITIO.forEach(g => {
    const sec = el('section', { class: 'grupo' }); sec.append(el('h2', { id: g.id }, g.grupo)); let any = false;
    g.modulos.forEach(m => {
      const items = m.items.filter(i => !qq || (m.nombre + ' ' + i.titulo + ' ' + (i.sub || '') + ' ' + i.tipo).toLowerCase().includes(qq));
      if (!items.length) return; any = true;
      const box = el('div', { class: 'modulo' }, el('h3', {}, m.nombre)), cards = el('div', { class: 'cards' });
      items.forEach(i => {
        const tipo = el('span', { class: 'tipo' }, i.url ? i.tipo : i.tipo + ' · Próximamente'); if (i.nuevo && i.url) tipo.append(el('span', { class: 'nuevo' }, 'Nuevo'));
        const kids = [tipo, el('span', { class: 'titulo' }, i.titulo)]; if (i.sub) kids.push(el('span', { class: 'sub' }, i.sub));
        cards.append(i.url ? el('a', { class: 'card', href: i.url }, ...kids) : el('div', { class: 'card', 'aria-disabled': 'true' }, ...kids));
      });
      box.append(cards); sec.append(box);
    });
    if (!any && qq) sec.append(el('p', { class: 'vacio' }, 'Nada en este grupo con «' + q + '».'));
    main.append(sec);
  });
}
SITIO.forEach(g => $('#nav').append(el('a', { href: '#' + g.id }, g.grupo.split(' · ')[0])));
$('#q').addEventListener('input', e => render(e.target.value));
render();
</script>
</body>
</html>
